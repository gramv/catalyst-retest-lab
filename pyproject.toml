[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-retest-lab"
version = "0.1.0"
description = "Paper-only CATALYST_RETEST_V1 research laboratory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "websockets>=17,<18"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
catalyst-lab = "catalyst_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
